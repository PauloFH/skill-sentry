name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly: the e2e job tries the latest Claude Code and Codex CLIs instead of the pinned ones.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      cli:
        description: CLI versions for the e2e job
        type: choice
        options: [pinned, latest]
        default: pinned
  workflow_call:
    inputs:
      cli:
        description: CLI versions for the e2e job (pinned or latest)
        type: string
        default: pinned

permissions:
  contents: read

env:
  # CLI builds verified to install skill-sentry non-interactively (see test/e2e/install.test.mjs).
  CLAUDE_CODE_PIN: 2.1.330
  CODEX_PIN: 0.171.0

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '22']
    steps:
      # Full history and tags: the known-release tests run `git archive v0.1.1`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Check that release tags are present
        shell: bash
        run: |
          git tag -l 'v*'
          git rev-parse --verify --quiet refs/tags/v0.1.1 >/dev/null || { echo "::error::tag v0.1.1 is missing from the checkout"; exit 1; }
      - name: Unit tests (npm test, no tag-related skips)
        run: node tools/ci/run-tests.mjs

  e2e:
    # Real CLIs, no model: install from the checkout through each CLI, trust the Codex hook as /hooks does, feed
    # the installed hook real payloads and run the installed scanners. Claude Code needs Node >= 22.
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Choose CLI versions
        id: cli
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.cli }}" = "latest" ]; then
            echo "claude=latest" >> "$GITHUB_OUTPUT"; echo "codex=latest" >> "$GITHUB_OUTPUT"
          else
            echo "claude=$CLAUDE_CODE_PIN" >> "$GITHUB_OUTPUT"; echo "codex=$CODEX_PIN" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Claude Code and Codex
        shell: bash
        run: |
          npm install -g "@anthropic-ai/claude-code@${{ steps.cli.outputs.claude }}" "@openai/codex@${{ steps.cli.outputs.codex }}"
          root="$(npm root -g)"
          # The native claude binary is put in place by the package's postinstall; run it if npm skipped it.
          claude --version || node "$root/@anthropic-ai/claude-code/install.cjs"
          claude --version
          codex --version
          echo "SKILL_SENTRY_E2E_NPM_ROOT=$root" >> "$GITHUB_ENV"
      - name: e2e install checks
        env:
          SKILL_SENTRY_E2E: '1'
        run: node --test --test-reporter=spec test/e2e/install.test.mjs
